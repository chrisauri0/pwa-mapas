<div class="dashboard">

  <h1>Dashboard de Navegación</h1>

  <div class="stats-grid">

    <div class="card">
      <h3>GPS</h3>
      <p>{{ gpsStatus() }}</p>
    </div>

    <div class="card">
      <h3>Destino</h3>
      <p>{{ destination() }}</p>
    </div>

    <div class="card">
      <h3>Distancia</h3>
      <p>{{ distance() }} m</p>
    </div>

    <div class="card">
      <h3>Nodos Ruta</h3>
      <p>{{ routeNodes() }}</p>
    </div>

  </div>

</div>
