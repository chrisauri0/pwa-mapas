<div class="map-container">
<img

*ngFor="let layer of layers"

[src]="'assets/maps/'+layer+'.svg'"

style="
position:absolute;
width:100%;
height:100%;">







<div
class="user-marker"

[style.left.%]="(userX/860)*100"

[style.top.%]="(userY/1016)*100">

</div>

<div style="position:fixed;top:10px;left:10px;z-index:99999;background:white">

X: {{userX}}

Y: {{userY}}

</div>

<div class="debug-panel">

GPS LAT:
{{debugLat}}

<br>

GPS LNG:
{{debugLng}}

<br>

Accuracy:
{{debugAccuracy}}

<br>

Inside Campus:
{{insideCampus}}

<br>

SVG X:
{{userX}}

<br>

SVG Y:
{{userY}}

</div>
</div>
